name: PHP CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: json, pdo, pdo_mysql

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: composer lint

      - name: Run PHPUnit when tests exist
        shell: bash
        run: |
          if find tests -type f -name '*Test.php' -print -quit 2>/dev/null | grep -q .; then
            composer test
          else
            echo 'No executable PHPUnit tests yet; syntax and Composer validation passed.'
          fi
